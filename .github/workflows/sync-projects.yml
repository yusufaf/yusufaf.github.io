name: Sync repo metadata
on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-projects
  cancel-in-progress: false
# TODO: drop `working-directory: new_sveltekit` and the `new_sveltekit/`
# prefix on `git add` below once Phase 5 promotes new_sveltekit/ to the repo
# root -- until then its package.json (and content/projects/) live one level
# down, not at repo root (which still has the old CRA app's package.json and
# no sync:projects script at all).
# The same promotion makes `package_json_file` (pnpm/action-setup) and
# `cache-dependency-path` (setup-node) unnecessary: drop those too.
jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new_sveltekit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { ref: source }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { package_json_file: new_sveltekit/package.json }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: lts/*, cache: pnpm, cache-dependency-path: new_sveltekit/pnpm-lock.yaml }
      - run: pnpm install
      - run: pnpm run sync:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add new_sveltekit/content/projects
          # One check, not two: after the commit nothing is staged, so a second
          # `git diff --cached --quiet || git push` is always true and skips the push.
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh repo metadata"
            git push
          fi
        working-directory: .
